<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallpaper Plus</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <!-- The window is lit by the selected monitor's wallpaper: two layers cross-fade on change. -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient__layer"></div>
    <div class="ambient__layer"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bm-sky" x1="0" y1="4" x2="0" y2="23" gradientUnits="userSpaceOnUse"><stop offset="0.0" stop-color="#221836"/><stop offset="0.36" stop-color="#b04e62"/><stop offset="0.64" stop-color="#f4b860"/><stop offset="1.0" stop-color="#fad696"/></linearGradient><radialGradient id="bm-glow"><stop offset="0" stop-color="#fff4de" stop-opacity=".45"/><stop offset="1" stop-color="#fff4de" stop-opacity="0"/></radialGradient><clipPath id="bm-screen"><rect x="2" y="4" width="28" height="19" rx="3.0"/></clipPath></defs><rect x="14.5" y="23" width="3" height="3.6" fill="#7d7885"/><rect x="10" y="26.4" width="12" height="2.2" rx="1.1" fill="#7d7885"/><g clip-path="url(#bm-screen)"><rect x="2" y="4" width="28" height="19" fill="url(#bm-sky)"/><circle cx="22.2" cy="9.4" r="5.9799999999999995" fill="url(#bm-glow)"/><polygon points="2.00,15.93 3.17,15.60 4.33,15.16 5.50,14.63 6.67,14.10 7.83,13.66 9.00,13.42 10.17,13.44 11.33,13.72 12.50,14.17 13.67,14.71 14.83,15.23 16.00,15.66 17.17,15.97 18.33,16.16 19.50,16.26 20.67,16.26 21.83,16.17 23.00,15.99 24.17,15.73 25.33,15.47 26.50,15.32 27.67,15.33 28.83,15.51 30.00,15.77 30.00,23.00 2.00,23.00" fill="#7a3450"/><polygon points="2.00,19.35 3.17,19.30 4.33,19.39 5.50,19.59 6.67,19.81 7.83,19.99 9.00,20.09 10.17,20.13 11.33,20.12 12.50,20.07 13.67,19.95 14.83,19.76 16.00,19.48 17.17,19.11 18.33,18.67 19.50,18.21 20.67,17.79 21.83,17.50 23.00,17.40 24.17,17.50 25.33,17.79 26.50,18.21 27.67,18.67 28.83,19.11 30.00,19.48 30.00,23.00 2.00,23.00" fill="#160f1c"/><path d="M19.9 9.0h4.6v0.8h-4.6zM21.8 7.1000000000000005h0.8v4.6h-0.8z" fill="#fff4de"/></g></svg>
      <span class="brand__name">Wallpaper Plus</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-view="monitors">Monitors</button>
      <button class="tab" role="tab" data-view="library">Library</button>
      <button class="tab" role="tab" data-view="settings">Settings</button>
    </nav>
    <button class="status" id="status" data-action="status"></button>
    <div class="winctl" role="group" aria-label="Window">
      <button class="winctl__btn" data-action="win" data-win="minimize" aria-label="Minimize" title="Minimize">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7"/></svg>
      </button>
      <button class="winctl__btn" data-action="win" data-win="maximize" aria-label="Maximize" title="Maximize">
        <svg class="glyph-max" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1.6"/></svg>
        <svg class="glyph-restore" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="4" width="5.5" height="5.5" rx="1.3"/><path d="M4.5 2.5h3.2c1 0 1.8.8 1.8 1.8v3.2"/></svg>
      </button>
      <button class="winctl__btn winctl__btn--close" data-action="win" data-win="close" aria-label="Close" title="Close (wallpapers keep playing)">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>
      </button>
    </div>
  </header>
  <!-- After the header on purpose: a later drag area would cover these grab strips. -->
  <div class="resize-edges" aria-hidden="true">
    <div data-edge="top"></div><div data-edge="topleft"></div><div data-edge="topright"></div>
  </div>

  <main class="views">
    <section class="view" id="view-monitors" data-view="monitors">
      <div class="stage" id="stage"></div>
      <div class="inspector" id="inspector"></div>
    </section>

    <section class="view" id="view-library" data-view="library" hidden>
      <div class="pickbar" id="pickbar" hidden></div>
      <div class="toolbar">
        <h1 class="title">Library</h1>
        <span class="toolbar__count mono" id="lib-count"></span>
        <div class="toolbar__spacer"></div>
        <label class="search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg>
          <input id="search" type="search" placeholder="Search videos" aria-label="Search videos">
        </label>
        <select id="sort" class="select" aria-label="Sort by">
          <option value="added">Recently added</option>
          <option value="name">Name</option>
          <option value="size">Resolution</option>
        </select>
        <button class="btn" data-action="add-folder">Add folder</button>
        <button class="btn btn--primary" data-action="add-videos">Add videos</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="lib-empty" hidden>
        <div class="empty__frame" aria-hidden="true"></div>
        <h2 class="empty__title">Your library is empty</h2>
        <p class="empty__text">Drop video files anywhere in this window, or add them below. MP4, MKV, WebM and MOV all work.</p>
        <div class="empty__actions">
          <button class="btn" data-action="add-folder">Add a folder</button>
          <button class="btn btn--primary" data-action="add-videos">Add videos</button>
        </div>
      </div>
    </section>

    <section class="view" id="view-settings" data-view="settings" hidden></section>
  </main>

  <div class="dropzone" id="dropzone" hidden>
    <div class="dropzone__frame">Drop to add to your library</div>
  </div>
  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>

# Builds both programs and the installer on every push to main and every pull request, and keeps
# the installer as a downloadable artifact of the run. Pushing a tag like v1.2.3 also publishes a
# GitHub Release "Wallpaper Plus 1.2.3" with WallpaperPlus-Setup-1.2.3.exe attached.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # nothing later needs git access; keep the token out of .git

      # Puts cl, rc, fxc and link on PATH and sets VSCMD_VER, so build.bat skips its own
      # Build Tools path. Third-party actions are pinned to a full commit, not a tag, which its
      # owner could move to other code; to update, look up the new tag's commit and review it.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # Always this exact version (the runner image may come with another one). Chocolatey checks
      # the download against the checksum recorded in that package version.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $version = '6.7.1'
          choco upgrade innosetup --version=$version --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
                  'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
          $installed = (Get-ItemProperty $keys -ErrorAction SilentlyContinue | Select-Object -First 1).DisplayVersion
          if ($installed -ne $version) { throw "Inno Setup $installed is installed, expected $version" }

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Pick version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.version.outputs.version }}" installer\WallpaperPlus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: WallpaperPlus-Setup-${{ steps.version.outputs.version }}
          path: release/WallpaperPlus-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WallpaperPlus-Setup-${{ needs.build.outputs.version }}

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Wallpaper Plus ${{ needs.build.outputs.version }}
          files: WallpaperPlus-Setup-${{ needs.build.outputs.version }}.exe
          body: |
            Download **WallpaperPlus-Setup-${{ needs.build.outputs.version }}.exe** below and run it.

            - Windows asks for admin permission, because Wallpaper Plus installs into Program Files.
            - The installer isn't code-signed, so Windows SmartScreen may say "Windows protected your PC". Click **More info**, then **Run anyway**.
            - Installing over an older version keeps your settings and library.

            Needs 64-bit Windows 11.
